# TLS optionnel via Caddy (Let's Encrypt).
# Prérequis : DNS du domaine → IP du VPS, ports 80/443 ouverts.
# Usage :
#   DOMAIN=botly.example.com EMAIL=admin@example.com \
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d
#
# Pare-feu : ouvre seulement 80/443 (et SSH). Le port 3000 n'est plus publié.

services:
  web:
    ports: !reset []
    environment:
      TRUST_PROXY: "1"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN required}
      EMAIL: ${EMAIL:?EMAIL required}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
