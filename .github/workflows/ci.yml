name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
      DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
      BOT_SECRETS_ENCRYPTION_KEY: ${{ secrets.BOT_SECRETS_ENCRYPTION_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Check required secrets
        run: |
          missing=0
          for name in DATABASE_URL NEXTAUTH_SECRET NEXTAUTH_URL NEXT_PUBLIC_APP_URL DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET BOT_SECRETS_ENCRYPTION_KEY; do
            eval "value=\${$name}"
            if [ -z "$value" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure these repository secrets in GitHub → Settings → Secrets and variables → Actions"
            exit 1
          fi
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
