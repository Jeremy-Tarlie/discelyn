name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
      NEXTAUTH_SECRET: ci-nextauth-secret-at-least-32-chars
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      DISCORD_CLIENT_ID: "000000000000000000"
      DISCORD_CLIENT_SECRET: ci-discord-client-secret
      DISCORD_BOT_TOKEN: ci.fake.discord.bot.token
      BOT_RUNTIME_URL: http://127.0.0.1:4001
      BOT_RUNTIME_SECRET: ci-runtime-secret
      TOKEN_ENCRYPTION_KEY: ci-token-encryption-key-for-tests
      CRON_SECRET: ci-cron-secret-for-tests
      APP_ENV: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Migrate database
        run: npx prisma migrate deploy
      - run: npm run typecheck
      - name: Install bot-runtime deps
        run: npm --prefix bot-runtime ci
      - run: npm run typecheck:runtime
      - run: npm run lint
      - run: npm test
      - name: DB smoke (schema reachable)
        run: node scripts/db-smoke.mjs
      - name: Preflight staging env
        run: node scripts/preflight-prod.mjs
      - run: npm run build
        env:
          NODE_ENV: production
          APP_ENV: staging
      - name: Build bot-runtime
        run: npm --prefix bot-runtime run build
