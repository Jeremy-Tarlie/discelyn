# Dev local full-stack Docker : seul le web est exposé sur l’hôte.
# Usage : docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# db / redis / runtime restent sur le réseau Docker interne (pas de ports hôte)
# → évite les collisions 5432/5433/6379 et force « tout dans Docker ».
services:
  web:
    ports:
      - "3000:3000"
    environment:
      # Dev derrière aucun reverse-proxy public ; rate-limit IP = direct.
      APP_ENV: development
      NEXT_PUBLIC_APP_ENV: development
